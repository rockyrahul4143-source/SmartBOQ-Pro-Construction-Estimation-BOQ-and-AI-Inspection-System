services:
  - type: web
    name: smartboq-pro-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    pythonVersion: "3.11.9"
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements-deploy.txt
    startCommand: python start_render.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartboq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"

databases:
  - name: smartboq-db
    databaseName: smartboq
    user: smartboq_user
    plan: free
    region: oregon
